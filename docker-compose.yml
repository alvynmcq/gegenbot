
services:
  # Web Dashboard Interface
  fpl-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fpl_dashboard
    command: python -m src.dashboard.app
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Background Optimization & Execution Daemon
  fpl-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fpl_worker
    command: python src/main.py --daemon
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    depends_on:
      - fpl-dashboard
